apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-api
  namespace: cloudops-lab
  labels:
    app: cloudops-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudops-api
  template:
    metadata:
      labels:
        app: cloudops-api
    spec:
      serviceAccountName: cloudops-api
      containers:
        - name: cloudops-api
          image: cloudops-ai:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PGHOST
              value: "172.18.0.1"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "cloudops_db"
            - name: PGUSER
              value: "cloudops_user"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudops-db-secret
                  key: PGPASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
