apiVersion: v1
kind: Service
metadata:
  name: cloudops-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: cloudops-api
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cloudops-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
