replicaCount: 1

image:
  repository: cloudops-ai
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

database:
  host: "172.18.0.1"
  port: "5432"
  name: "cloudops_db"
  user: "cloudops_user"
  existingSecret: "cloudops-db-secret"
  passwordKey: "PGPASSWORD"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
